server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /bastidores/ existiu de 04 a 06/10/2026 e saiu no redesenho: o diário
    # agora mora na página principal. Quem tiver o link cai nele.
    location ~ ^/bastidores/?$ {
        return 301 /#diario;
    }

    # SPA fallback (volta pro index em qualquer rota)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache agressivo nos assets versionados do Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # as fontes são auto-hospedadas e não passam pelo hash do Vite. Cache de
    # um dia, e não de um ano: trocar o arquivo com o mesmo nome não pode
    # deixar visitante preso na versão velha.
    location /fontes/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
