    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignora SVG aqui: sem PNG, "adicionar à tela de início" vira print da página. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2E2118" />

    <!-- Antes da primeira pintura, de propósito inline:
         1. o tema salvo (a mesma chave do botão de sol e lua), senão quem
            escolheu o escuro vê o claro piscar;
         2. a classe "js", que arma a entrada animada do topo. Sem JS a página
            fica inteira e parada, nunca invisível. Se o movimento não chegar
            em 2,5s (rede ruim no navegador do Instagram), "solta" mostra tudo. -->
    <script>
      (function () {
        var r = document.documentElement;
        try {
          var t = localStorage.getItem("satomiq-tema");
          if (t === "light" || t === "dark") r.dataset.theme = t;
        } catch (e) {}
        r.classList.add("js");
        setTimeout(function () { r.classList.add("solta"); }, 2500);
      })();
    </script>
